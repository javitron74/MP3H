<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MP3H – Login</title>
<link rel="stylesheet" href="styles.css">

<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        margin: 0;
    }

    .login-panel {
        background: var(--panel);
        padding: 40px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 340px;
        text-align: center;
        animation: fadeIn 0.3s ease;
    }

    .login-title {
        font-size: 1.6rem;
        margin-bottom: 20px;
        color: var(--accent);
        font-weight: bold;
    }

    .login-input {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: var(--radius);
        border: 1px solid var(--panel-light);
        background: var(--panel-light);
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
    }

    .login-input:focus {
        border-color: var(--accent);
    }

    .login-btn {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: var(--accent);
        border: none;
        border-radius: var(--radius);
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
    }

    .login-btn:hover {
        background: var(--accent2);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="login-panel">
    <div class="login-title">MP3H – Acceso</div>

    <input id="email" type="email" class="login-input" placeholder="Introduce tu email">

    <button class="login-btn" onclick="login()">Entrar</button>
</div>

<script>
function login() {
    const email = document.getElementById("email").value.trim();

    if (!email) {
        alert("Introduce un email válido");
        return;
    }

    localStorage.setItem("email", email);
	localStorage.setItem("loginTime", Date.now()); // <-- aquí guardamos la fecha
    window.location.href = "index.html";
}
</script>

</body>
</html>
