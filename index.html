<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP3H – Lista de discos</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="top-header">
    <!-- Línea 1: título -->
    <div class="header-title">
        <h1>MP3H – Lista de discos</h1>
    </div>

    <!-- Línea 2: iconos -->
    <div class="header-actions">
	
		<input id="search" class="header-search" type="text" placeholder="Buscar banda, disco, comentarios…">

        <!-- Reset JSON -->
        <span id="btnReset" class="header-icon" title="Reimportar JSON">
            <svg viewBox="0 0 24 24">
                 <path d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-8-8v3l4-4-4-4v3z"/>
            </svg>
        </span>

        <!-- Panel de filtros -->
        <span id="btnPanel" class="header-icon" title="Filtros">
            <svg viewBox="0 0 24 24">
                <path d="M3 6h18M6 12h12M10 18h4" stroke-linecap="round"/>
            </svg>
        </span>

        <!-- Ir a nuevos grupos -->
        <a href="nuevosgrupos.html" class="header-icon" title="Listado de grupos">
            <svg viewBox="0 0 24 24">
				<path d="M12 14c1.381 0 2.631-.56 3.536-1.465.904-.904 1.464-2.154 1.464-3.535s-.56-2.631-1.464-3.535c-.905-.905-2.155-1.465-3.536-1.465s-2.631.56-3.536 1.465c-.904.904-1.464 2.154-1.464 3.535s.56 2.631 1.464 3.535c.905.905 2.155 1.465 3.536 1.465z
				M20 15c.69 0 1.315-.279 1.768-.731.453-.452.732-1.077.732-1.769 0-.69-.279-1.315-.732-1.768-.453-.453-1.078-.732-1.768-.732-.691 0-1.316.279-1.769.732-.452.453-.731 1.078-.731 1.768 0 .691.279 1.316.731 1.769s1.078.731 1.769.731z
				M20 15.59c-1.331 0-2.332.406-2.917.968-1.115-.917-2.878-1.558-5.083-1.558-2.266 0-3.995.648-5.092 1.564-.596-.565-1.608-.974-2.908-.974-2.188 0-3.5 1.09-3.5 2.182 0 .545 1.312 1.092 3.5 1.092.604 0 1.146-.051 1.623-.133l-.04.27c0 1 2.406 2 6.417 2 3.762 0 6.417-1 6.417-2l-.02-.255c.463.073.995.118 1.603.118 2.051 0 3.5-.547 3.5-1.092 0-1.092-1.373-2.182-3.5-2.182z
				M4 15c.69 0 1.315-.279 1.768-.732.453-.453.732-1.078.732-1.768 0-.689-.279-1.314-.732-1.768-.453-.452-1.078-.732-1.768-.732-.691 0-1.316.28-1.769.732-.452.454-.731 1.079-.731 1.768 0 .69.279 1.315.731 1.768.453.453 1.078.732 1.769.732z"/>
            </svg>
        </a>

    </div>

	<div id="panelFiltros" class="panel-filtros">
		<button id="closePanel" class="panel-close-icon btn-icon">
			<svg viewBox="0 0 24 24">
				<path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>
			</svg>
		</button>
		<h3>Ordenación</h3>
		<div class="ordenacion-row">
			<select id="sortField">
				<option value="">Ordenar por…</option>
				<option value="Pos">Item</option>
				<option value="Banda">Banda</option>
				<option value="Disco">Disco</option>
				<option value="Genero">Género</option>
				<option value="Estado">Estado</option>
				<option value="Puntuacion">Puntuación</option>
				<option value="Emision">Fecha de emisión</option>
			</select>

			<select id="sortDir">
				<option value="asc">Ascendente</option>
				<option value="desc" selected>Descendente</option>
			</select>
		</div>
		<h3>Filtros</h3>
		<div class="filters">
			<h5 style="margin-top: 5px;margin-bottom: 5px;">Por genero</h5>
			<select id="filterGenero">
				<option value="">Todos los géneros</option>
			</select>
			<h5 style="margin-top: 5px;margin-bottom: 5px;">Por estado</h5>
			<div id="filterEstado" class="multi-select">
				<span data-value="---" class="pill">---</span>
				<span data-value="Pre-ok" class="pill">Pre-ok</span>
				<span data-value="Ok" class="pill">Ok</span>
				<span data-value="No" class="pill">No</span>
				<span data-value="Disp" class="pill">Disp</span>
			</div>
		</div>
	</div>

</header>

<main>
	<div class="top-bar">
		<div id="add"><a href="form-edit.html" class="btn-add">Añadir nuevo</a></div>
		<div class="right-group">
			<span id="count">Cargando datos…</span>
			<span id="toggleVista" class="vista-icon" title="Cambiar vista">
				<svg viewBox="0 0 24 24" class="vista-svg">
					<path 
					d="M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2M3 8v6m0-6h6m12 0v6m0-6H9m12 6v4a2 2 0 0 1-2 2H9m12-6H9m-6 0v4a2 2 0 0 0 2 2h4m-6-6h6m0-6v6m0 0v6m6-12v12"
					stroke="var(--text)"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					fill="none"
					/>
					<path 
						d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2H3V6z"
						fill="var(--text)"
						opacity="0.25"
					/>
				</svg>
			</span>
		</div>
	</div>
    <div id="grid" class="grid"></div>
	<div id="modalIA" class="modal-ia"></div>
</main>

<script>
window.MP3H_CONFIG = {
    tipo: "discos",
    json: "get?dataset=mp3h",
    update: "update?dataset=mp3h",
    formulario: "form-edit.html",
    apiKey: "",
	defaultModoVista: "cards",
    campos: [
        "Pos","Banda","Disco","Genero",
        "Emision Disco","Estado","Comentarios",
        "Puntuacion","Fuente Puntuacion"
    ]
};
</script>

<script src="script_scalable.js"></script>
</body>
</html>
