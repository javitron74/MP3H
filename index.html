<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MP3H – Lista discos</title>
<style>
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #e5e7eb;
        margin: 0;
        padding: 0;
    }
    header {
        padding: 1.5rem 2rem;
        background: #0f172a;
        border-bottom: 1px solid #1f2937;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: space-between;
    }
    header h1 {
        margin: 0;
        font-size: 1.4rem;
    }
    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
    }
    .filters input,
    .filters select {
        padding: 0.4rem 0.6rem;
        border-radius: 0.375rem;
        border: 1px solid #374151;
        background: #111827;
        color: #e5e7eb;
        font-size: 0.9rem;
    }
    .filters input::placeholder {
        color: #6b7280;
    }
    main {
        padding: 1.5rem 2rem;
    }
    #count {
        margin-bottom: 0.75rem;
        font-size: 0.9rem;
        color: #9ca3af;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
    }
    .card {
        background: #1f2937;
        border-radius: 0.75rem;
        padding: 1rem;
        border: 1px solid #374151;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
    }
    .card-title {
        font-weight: 600;
        font-size: 1rem;
    }
    .card-subtitle {
        font-size: 0.85rem;
        color: #9ca3af;
    }
    .pill {
        display: inline-flex;
        align-items: center;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 500;
    }
    .pill-genero {
        background: #4b5563;
        color: #e5e7eb;
    }
    .pill-estado {
        background: #059669;
        color: #ecfdf5;
    }
    .pill-estado.no {
        background: #b91c1c;
        color: #fee2e2;
    }
    .card-body {
        font-size: 0.85rem;
        color: #d1d5db;
    }
    .card-footer {
        margin-top: 0.4rem;
        font-size: 0.8rem;
        color: #9ca3af;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .badge {
        padding: 0.1rem 0.4rem;
        border-radius: 999px;
        border: 1px solid #4b5563;
        font-size: 0.75rem;
    }
    @media (max-width: 640px) {
        header {
            padding: 1rem 1rem;
        }
        main {
            padding: 1rem 1rem;
        }
    }
</style>
</head>
<body>

<header>
    <h1>MP3H – Lista de discos</h1>
    <div class="filters">
        <input id="search" type="text" placeholder="Buscar banda, disco, comentarios…">
        <select id="filterGenero">
            <option value="">Todos los géneros</option>
        </select>
        <select id="filterEstado">
            <option value="">Todos los estados</option>
            <option value="Si">Emitido</option>
            <option value="No">No emitido</option>
        </select>
    </div>
</header>

<main>
    <div id="count">Cargando datos…</div>
    <div id="grid" class="grid"></div>
</main>

<script>
let datos = [];

function normalizarTexto(t) {
    return (t || "").toString().toLowerCase();
}

function render() {
    const grid = document.getElementById("grid");
    const count = document.getElementById("count");
    const q = normalizarTexto(document.getElementById("search").value);
    const g = document.getElementById("filterGenero").value;
    const e = document.getElementById("filterEstado").value;

    const filtrados = datos.filter(item => {
        const banda = normalizarTexto(item.Banda);
        const disco = normalizarTexto(item.Disco);
        const genero = normalizarTexto(item.Genero);
        const comentarios = normalizarTexto(item.Comentarios);
        const estado = (item.Estado || "").toString();

        const coincideTexto =
            !q ||
            banda.includes(q) ||
            disco.includes(q) ||
            genero.includes(q) ||
            comentarios.includes(q);

        const coincideGenero = !g || genero === normalizarTexto(g);
        const coincideEstado = !e || estado === e;

        return coincideTexto && coincideGenero && coincideEstado;
    });

    count.textContent = `${filtrados.length} resultado(s)`;

    grid.innerHTML = "";
    filtrados.forEach(item => {
        const estado = (item.Estado || "").toString();
        const genero = item.Genero || "";
        const puntuacion = item.Puntuacion || "";
        const comentarios = item.Comentarios || "";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-header">
                <div>
                    <div class="card-title">${item.Banda || "Sin banda"}</div>
                    <div class="card-subtitle">${item.Disco || "Sin disco"}</div>
                </div>
                <div>
                    <span class="pill pill-genero">${genero || "Sin género"}</span>
                    <span class="pill pill-estado ${estado === "No" ? "no" : ""}">
                        ${estado === "Si" ? "Emitido" : estado === "No" ? "No emitido" : "Estado desconocido"}
                    </span>
                </div>
            </div>
            <div class="card-body">
                ${comentarios ? comentarios : "<em>Sin comentarios</em>"}
            </div>
            <div class="card-footer">
                <span class="badge">Puntuación: ${puntuacion || "-"}</span>
            </div>
        `;
        grid.appendChild(card);
    });
}

function inicializarFiltros() {
    const selectGenero = document.getElementById("filterGenero");
    const generosUnicos = Array.from(
        new Set(
            datos
                .map(d => (d.Genero || "").toString())
                .filter(g => g.trim() !== "")
        )
    ).sort((a, b) => a.localeCompare(b, "es"));

    generosUnicos.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = g;
        selectGenero.appendChild(opt);
    });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filterGenero").addEventListener("change", render);
document.getElementById("filterEstado").addEventListener("change", render);

fetch("data/new_mp3h.json")
    .then(r => r.json())
    .then(data => {
        datos = Array.isArray(data) ? data : [];
        inicializarFiltros();
        render();
    })
    .catch(err => {
        document.getElementById("count").textContent = "Error cargando JSON: " + err;
    });
</script>

</body>
</html>
