<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MP3H – Lista de discos</title>

<style>
    :root {
        --bg: #0f0f10;
        --panel: #1a1b1e;
        --panel-light: #232428;
        --text: #e5e7eb;
        --text-dim: #9ca3af;
        --accent: #6366f1;
        --accent2: #3b82f6;
        --radius: 12px;
        --shadow: 0 8px 25px rgba(0,0,0,0.35);
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
    }

    header {
        padding: 1.5rem 2rem;
        background: var(--panel);
        border-bottom: 1px solid #2c2d31;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: space-between;
    }

    header h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 600;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        color: transparent;
    }

    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
    }

    .filters input,
    .filters select {
        padding: 0.55rem 0.75rem;
        border-radius: var(--radius);
        border: 1px solid #3a3b3f;
        background: var(--panel-light);
        color: var(--text);
        font-size: 0.9rem;
        transition: 0.2s;
    }

    .filters input:focus,
    .filters select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
    }

    main {
        padding: 1.5rem 2rem;
    }

    #count {
        margin-bottom: 1rem;
        font-size: 0.95rem;
        color: var(--text-dim);
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 1.25rem;
    }

    .card {
        background: var(--panel-light);
        border-radius: var(--radius);
        padding: 1.25rem;
        border: 1px solid #2f3034;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
    }

    .card-title {
        font-size: 1.1rem;
        font-weight: 600;
    }

    .card-subtitle {
        font-size: 0.85rem;
        color: var(--text-dim);
    }

    .pill {
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 500;
        display: inline-block;
    }

    .pill-genero {
        background: #4b5563;
        color: #e5e7eb;
    }

    .pill-estado {
        background: #059669;
        color: #ecfdf5;
    }

    .pill-estado.no {
        background: #b91c1c;
        color: #fee2e2;
    }

    .pill-emision {
        background: #3b82f6;
        color: white;
        padding: 0.2rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
    }

    .pill-emision.no {
        background: #b91c1c;
    }

    .card-body {
        font-size: 0.9rem;
        color: #d1d5db;
        line-height: 1.35rem;
    }

    .card-footer {
        margin-top: 0.4rem;
        font-size: 0.8rem;
        color: var(--text-dim);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .badge {
        padding: 0.2rem 0.5rem;
        border-radius: 999px;
        border: 1px solid #4b5563;
        font-size: 0.75rem;
    }

    /* MÓVILES PEQUEÑOS */
@media (max-width: 480px) {

    body {
        font-size: 1.05rem; /* Aumenta todo el texto base */
    }

    header {
        padding: 1rem 1rem;
    }

    .filters input,
    .filters select {
        font-size: 1rem;
        padding: 0.75rem;
    }

    .grid {
        grid-template-columns: 1fr !important; /* UNA TARJETA POR FILA */
        gap: 1.5rem;
    }

    .card {
        padding: 1.4rem;
        border-radius: 14px;
    }

    .card-title {
        font-size: 1.25rem; /* MÁS GRANDE */
    }

    .card-subtitle {
        font-size: 1.05rem;
    }

    .card-body {
        font-size: 1.05rem;
        line-height: 1.55rem;
    }

    .pill,
    .pill-genero,
    .pill-estado,
    .pill-emision {
        font-size: 0.95rem;
        padding: 0.35rem 0.75rem; /* Pills más grandes */
    }

    .badge {
        font-size: 0.95rem;
        padding: 0.3rem 0.6rem;
    }
}

/* MÓVILES MUY PEQUEÑOS (iPhone SE, Android compactos) */
@media (max-width: 380px) {

    body {
        font-size: 1.15rem; /* TODAVÍA MÁS GRANDE */
    }

    .card {
        padding: 1.6rem;
    }

    .card-title {
        font-size: 1.35rem;
    }

    .card-body {
        font-size: 1.15rem;
    }

    .pill {
        font-size: 1rem;
        padding: 0.45rem 0.85rem;
    }
}

</style>
</head>

<body>

<header>
    <h1>MP3H – Lista de discos</h1>

    <div class="filters">
        <input id="search" type="text" placeholder="Buscar banda, disco, comentarios…">

        <select id="filterGenero">
            <option value="">Todos los géneros</option>
        </select>

        <select id="filterEstado">
            <option value="">Todos los estados</option>
            <option value="Si">Emitido</option>
            <option value="No">No emitido</option>
        </select>

        <select id="sortField">
            <option value="">Ordenar por…</option>
            <option value="Banda">Banda</option>
            <option value="Disco">Disco</option>
            <option value="Genero">Género</option>
            <option value="Estado">Estado</option>
            <option value="Puntuacion">Puntuación</option>
            <option value="Emision">Fecha de emisión</option>
        </select>

        <select id="sortDir">
            <option value="asc">Ascendente</option>
            <option value="desc">Descendente</option>
        </select>
    </div>
</header>

<main>
    <div id="count">Cargando datos…</div>
    <div id="grid" class="grid"></div>
</main>

<script>
let datos = [];

function normalizar(t) {
    return (t || "").toString().toLowerCase();
}

function render() {
    const grid = document.getElementById("grid");
    const count = document.getElementById("count");

    const q = normalizar(document.getElementById("search").value);
    const g = document.getElementById("filterGenero").value;
    const e = document.getElementById("filterEstado").value;

    let filtrados = datos.filter(item => {
        const banda = normalizar(item.Banda);
        const disco = normalizar(item.Disco);
        const genero = normalizar(item.Genero);
        const comentarios = normalizar(item.Comentarios);
        const estado = (item.Estado || "").toString();

        const coincideTexto =
            !q ||
            banda.includes(q) ||
            disco.includes(q) ||
            genero.includes(q) ||
            comentarios.includes(q);

        const coincideGenero = !g || genero === normalizar(g);
        const coincideEstado = !e || estado === e;

        return coincideTexto && coincideGenero && coincideEstado;
    });

    // ORDENACIÓN
    const campo = document.getElementById("sortField").value;
    const dir = document.getElementById("sortDir").value;

    if (campo) {
        if (campo === "Emision") {
            filtrados.sort((a, b) => {
                const A = new Date(a.Emision || "1900-01-01");
                const B = new Date(b.Emision || "1900-01-01");
                return dir === "asc" ? A - B : B - A;
            });
        } else {
            filtrados.sort((a, b) => {
                let A = (a[campo] || "").toString().toLowerCase();
                let B = (b[campo] || "").toString().toLowerCase();

                if (!isNaN(a[campo]) && !isNaN(b[campo])) {
                    A = Number(a[campo]);
                    B = Number(b[campo]);
                }

                if (A < B) return dir === "asc" ? -1 : 1;
                if (A > B) return dir === "asc" ? 1 : -1;
                return 0;
            });
        }
    }

    count.textContent = `${filtrados.length} resultado(s)`;

    grid.innerHTML = "";
    filtrados.forEach(item => {
        const estado = (item.Estado || "").toString();
        const genero = item.Genero || "";
        const puntuacion = item.Puntuacion || "";
        const comentarios = item.Comentarios || "";
        const emision = item.Emision || "";

        const fechaEmision = emision ? new Date(emision) : null;
        const hoy = new Date();
        const noEmitido = fechaEmision && fechaEmision > hoy;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-header">
                <div>
                    <div class="card-title">${item.Banda}</div>
                    <div class="card-subtitle">${item.Disco}</div>
                </div>
                <div>
                    <span class="pill pill-genero">${genero}</span>
                    <span class="pill pill-estado ${estado === "No" ? "no" : ""}">
                        ${estado === "Si" ? "Emitido" : "No emitido"}
                    </span>
                </div>
            </div>

            <div class="card-body">
                <strong>Emisión:</strong>
                ${
                    emision
                        ? noEmitido
                            ? `<span class="pill-emision no">No emitido</span> (${emision})`
                            : `<span class="pill-emision">Emitido</span> (${emision})`
                        : "<em>Sin fecha</em>"
                }
                <br><br>
                ${comentarios || "<em>Sin comentarios</em>"}
            </div>

            <div class="card-footer">
                <span class="badge">Puntuación: ${puntuacion || "-"}</span>
            </div>
        `;

        grid.appendChild(card);
    });
}

function cargarFiltros() {
    const selectGenero = document.getElementById("filterGenero");

    const generos = Array.from(
        new Set(datos.map(d => (d.Genero || "").trim()).filter(g => g !== ""))
    ).sort((a, b) => a.localeCompare(b, "es"));

    generos.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = g;
        selectGenero.appendChild(opt);
    });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filterGenero").addEventListener("change", render);
document.getElementById("filterEstado").addEventListener("change", render);
document.getElementById("sortField").addEventListener("change", render);
document.getElementById("sortDir").addEventListener("change", render);

fetch("data/new_mp3h.json")
    .then(r => r.json())
    .then(data => {
        datos = Array.isArray(data) ? data : [];
        cargarFiltros();
        render();
    })
    .catch(err => {
        document.getElementById("count").textContent = "Error cargando JSON: " + err;
    });
</script>

</body>
</html>
