<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MP3H Cards</title>

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  padding: 20px;
}

h2 {
  margin-bottom: 10px;
}

.filters {
  margin-bottom: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

input, select {
  padding: 8px;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.estado {
  padding: 6px 10px;
  border-radius: 6px;
  color: white;
  font-weight: bold;
  display: inline-block;
  margin-top: 5px;
}

.estado-disp { background: #2ecc71; }
.estado-no { background: #e74c3c; }
.estado-preok { background: #e67e22; }
.estado-ok { background: #3498db; }
</style>
</head>
<body>

<h2>MP3H – Vista Tarjetas</h2>

<div class="filters">
  <input type="text" id="buscador" placeholder="Buscar...">
  
  <select id="filtroGenero">
    <option value="">Filtrar por género</option>
  </select>

  <select id="filtroEstado">
    <option value="">Filtrar por estado</option>
  </select>
</div>

<div id="contenedor" class="grid"></div>

<script>
fetch("data/new_mp3h.json")
  .then(r => r.json())
  .then(data => {

    const contenedor = document.getElementById("contenedor");
    const filtroGenero = document.getElementById("filtroGenero");
    const filtroEstado = document.getElementById("filtroEstado");
    const buscador = document.getElementById("buscador");

    // Obtener listas únicas
    const generos = [...new Set(data.map(x => x.genero).filter(x => x))];
    const estados = [...new Set(data.map(x => x.estado).filter(x => x))];

    generos.sort();
    estados.sort();

    generos.forEach(g => {
      filtroGenero.innerHTML += `<option value="${g}">${g}</option>`;
    });

    estados.forEach(e => {
      filtroEstado.innerHTML += `<option value="${e}">${e}</option>`;
    });

    function pintarTarjetas() {
      const g = filtroGenero.value.toLowerCase();
      const e = filtroEstado.value.toLowerCase();
      const b = buscador.value.toLowerCase();

      contenedor.innerHTML = "";

      data
        .filter(item => (!g || item.genero.toLowerCase() === g))
        .filter(item => (!e || item.estado.toLowerCase() === e))
        .filter(item =>
          !b ||
          item.banda.toLowerCase().includes(b) ||
          item.disco.toLowerCase().includes(b) ||
          item.genero.toLowerCase().includes(b) ||
          item.estado.toLowerCase().includes(b) ||
          (item.comentarios || "").toLowerCase().includes(b)
        )
        .forEach(item => {

          let claseEstado = "";
          const est = item.estado?.toLowerCase();

          if (est === "disp") claseEstado = "estado-disp";
          else if (est === "no") claseEstado = "estado-no";
          else if (est === "pre-ok") claseEstado = "estado-preok";
          else if (est === "ok") claseEstado = "estado-ok";

          const card = `
            <div class="card">
              <h3>${item.banda}</h3>
              <p><strong>Disco:</strong> ${item.disco}</p>
              <p><strong>Género:</strong> ${item.genero}</p>
              <p><strong>Emisión:</strong> ${item.emision || ""}</p>
              <p><strong>Comentarios:</strong> ${item.comentarios || ""}</p>
              <span class="estado ${claseEstado}">${item.estado}</span>
            </div>
          `;

          contenedor.innerHTML += card;
        });
    }

    filtroGenero.addEventListener("change", pintarTarjetas);
    filtroEstado.addEventListener("change", pintarTarjetas);
    buscador.addEventListener("input", pintarTarjetas);

    pintarTarjetas();
  });
</script>

</body>
</html>
