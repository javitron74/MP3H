<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MP3H Cards</title>

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  padding: 20px;
}

h2 {
  margin-bottom: 10px;
}

.filters {
  margin-bottom: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

input, select {
  padding: 8px;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.estado {
  padding: 6px 10px;
  border-radius: 6px;
  color: white;
  font-weight: bold;
  display: inline-block;
  margin-top: 5px;
}

.estado-disp { background: #2ecc71; }
.estado-no { background: #e74c3c; }
.estado-preok { background: #e67e22; }
.estado-ok { background: #3498db; }
</style>
</head>
<body>


<h2>Prueba lectura JSON</h2>
<div id="resultado"></div>

<script>
fetch("data/new_mp3h.json")
  .then(r => r.json())
  .then(data => {
    let html = "<ul>";
    data.forEach(item => {
      html += `<li>${item.banda} - ${item.disco} (${item.genero})</li>`;
    });
    html += "</ul>";
    document.getElementById("resultado").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("resultado").innerHTML = "Error cargando JSON: " + err;
  });
</script>

</body>
</html>
