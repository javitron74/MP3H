<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MP3H – Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="form-container">
		<div class="header">
			<div class="title" id="formTitle">Disco</div>
		</div>
        <div class="form-grid">
		
			<div class="form-group">
                <label>Pos</label>
                <input id="Pos" type="text">
            </div>

            <div class="form-group">
                <label>Banda</label>
                <input id="banda" type="text">
            </div>

            <div class="form-group">
                <label>Disco</label>
                <input id="disco" type="text">
            </div>

            <div class="form-group">
                <label>Género</label>
                <input id="genero" type="text">
            </div>

            <div class="form-group">
                <label>Fecha de emisión</label>
                <input id="emision" type="date">
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select id="estado">
                    <option value="---">---</option>
                    <option value="Ok">Ok</option>
                    <option value="Pre-ok">Pre-ok</option>
                    <option value="Disp">Disp</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Puntuación (0–10)</label>
                <input id="puntuacion" type="range" min="0" max="10" step="1">
                <div class="range-value">Valor: <span id="rangeValue">0</span></div>
            </div>

            <div class="form-group form-group-full">
                <label>Comentarios</label>
                <textarea id="comentarios"></textarea>
            </div>

        </div>
		<!-- Escritorio: botones normales -->
		<div class="action-desktop">
			<button class="btn-save" id="btnGuardar">Guardar</button>
			<a href="index.html" class="back">Cancelar / Volver</a>
		</div>
    </div>

	<!-- Móvil: barra fija -->
	<div class="action-bar">
		<button class="btn-save" id="btnGuardarMobile">Guardar</button>
		<a href="index.html" class="back">Cancelar</a>
	</div>

	<script src="script.js"></script>

</body>
</html>
