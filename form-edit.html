<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar registro MP3H</title>


</head>

<body>

<div class="toggle" onclick="toggleMode()">Cambiar modo</div>

<div class="container">
  <h1>Editar registro</h1>

<div class="form-horizontal">

    <div>
        <label>Banda</label>
        <input id="banda" type="text">
    </div>

    <div>
        <label>Disco</label>
        <input id="disco" type="text">
    </div>

    <div>
        <label>Género</label>
        <input id="genero" type="text">
    </div>

    <div>
        <label>Emisión</label>
        <input id="emision" type="date">
    </div>

    <div>
        <label>Estado</label>
        <div id="estadoPills">
            <span class="pill-estado" data-value="Ok">Ok</span>
            <span class="pill-estado" data-value="Pre-ok">Pre-ok</span>
            <span class="pill-estado" data-value="Disp">Disp</span>
            <span class="pill-estado" data-value="No">No</span>
            <span class="pill-estado" data-value="---">---</span>
        </div>
    </div>

    <div>
        <label>Puntuación</label>
        <div class="rating" id="rating">
            <span data-value="1">★</span>
            <span data-value="2">★</span>
            <span data-value="3">★</span>
            <span data-value="4">★</span>
            <span data-value="5">★</span>
        </div>
    </div>

    <div style="grid-column: span 2;">
        <label>Comentarios</label>
        <textarea id="comentarios"></textarea>
    </div>

</div>

<button class="btn-save" id="btnGuardar">Guardar</button>


  <button onclick="guardar()">Guardar cambios</button>
  <a href="index.html" class="back">Volver a la lista</a>
</div>

<script>
const WORKER = "https://mp3h-backend.josejaviertroncoso.workers.dev";
let datos = [];
let idx = null;

function toggleMode() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

async function cargar() {
  const params = new URLSearchParams(location.search);
  const pos = params.get("pos");

  const res = await fetch(WORKER + "/mp3h.json");
  datos = await res.json();

  const registro = datos.find(d => d.Pos == pos)

  Pos.value = registro.Pos || "";
  Banda.value = registro.Banda || "";
  Disco.value = registro.Disco || "";
  Genero.value = registro.Genero || "";
  Emision.value = registro["Emision Disco"] || "";
  Estado.value = registro.Estado || "";
  Comentarios.value = registro.Comentarios || "";
  Puntuacion.value = registro.Puntuacion || "";
}

async function guardar() {
  datos[idx] = {
    Pos: Pos.value,
    Banda: Banda.value,
    Disco: Disco.value,
    Genero: Genero.value,
    "Emision Disco": Emision.value,
    Estado: Estado.value,
    Comentarios: Comentarios.value,
    Puntuacion: Puntuacion.value
  };

  await fetch(WORKER + "/update", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  });

  alert("Registro actualizado");
}

cargar();
</script>

</body>
</html>
