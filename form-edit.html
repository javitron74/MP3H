<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar registro MP3H</title>

<style>
:root {
  --bg-light: #f5f5f5;
  --panel-light: #ffffff;
  --text-light: #222;
  --accent: #6366f1;

  --bg-dark: #0f0f10;
  --panel-dark: #1a1b1e;
  --text-dark: #e5e7eb;

  --radius: 12px;
  --shadow: 0 8px 25px rgba(0,0,0,0.35);
}

body {
  margin: 0;
  padding: 20px;
  font-family: "Segoe UI", Arial;
  transition: 0.3s;
}

body.light {
  background: var(--bg-light);
  color: var(--text-light);
}

body.dark {
  background: var(--bg-dark);
  color: var(--text-dark);
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

body.light .container {
  background: var(--panel-light);
}

body.dark .container {
  background: var(--panel-dark);
}

label {
  display: block;
  margin-top: 15px;
  font-size: 14px;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border-radius: var(--radius);
  border: 1px solid #333;
  background: #232428;
  color: #e5e7eb;
  font-size: 14px;
}

body.light input, body.light select, body.light textarea {
  background: #f0f0f0;
  color: #222;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 25px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.toggle {
  text-align: right;
  margin-bottom: 10px;
  cursor: pointer;
  color: var(--accent);
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: var(--accent);
  text-decoration: none;
}
</style>
</head>

<body>

/*<div class="toggle" onclick="toggleMode()">Cambiar modo</div>*/

<div class="container">
  <h1>Editar registro</h1>

<div class="form-horizontal">

    <div>
        <label>Banda</label>
        <input id="banda" type="text">
    </div>

    <div>
        <label>Disco</label>
        <input id="disco" type="text">
    </div>

    <div>
        <label>Género</label>
        <input id="genero" type="text">
    </div>

    <div>
        <label>Emisión</label>
        <input id="emision" type="date">
    </div>

    <div>
        <label>Estado</label>
        <div id="estadoPills">
            <span class="pill-estado" data-value="Ok">Ok</span>
            <span class="pill-estado" data-value="Pre-ok">Pre-ok</span>
            <span class="pill-estado" data-value="Disp">Disp</span>
            <span class="pill-estado" data-value="No">No</span>
            <span class="pill-estado" data-value="---">---</span>
        </div>
    </div>

    <div>
        <label>Puntuación</label>
        <div class="rating" id="rating">
            <span data-value="1">★</span>
            <span data-value="2">★</span>
            <span data-value="3">★</span>
            <span data-value="4">★</span>
            <span data-value="5">★</span>
        </div>
    </div>

    <div style="grid-column: span 2;">
        <label>Comentarios</label>
        <textarea id="comentarios"></textarea>
    </div>

</div>

<button class="btn-save" id="btnGuardar">Guardar</button>


  <button onclick="guardar()">Guardar cambios</button>
  <a href="index.html" class="back">Volver a la lista</a>
</div>

<script>
const WORKER = "https://mp3h-backend.josejaviertroncoso.workers.dev";
let datos = [];
let idx = null;

function toggleMode() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

async function cargar() {
  const params = new URLSearchParams(location.search);
  const pos = params.get("pos");

  const res = await fetch(WORKER + "/mp3h.json");
  datos = await res.json();

  const registro = datos.find(d => d.Pos == pos)

  Pos.value = registro.Pos || "";
  Banda.value = registro.Banda || "";
  Disco.value = registro.Disco || "";
  Genero.value = registro.Genero || "";
  Emision.value = registro["Emision Disco"] || "";
  Estado.value = registro.Estado || "";
  Comentarios.value = registro.Comentarios || "";
  Puntuacion.value = registro.Puntuacion || "";
}

async function guardar() {
  datos[idx] = {
    Pos: Pos.value,
    Banda: Banda.value,
    Disco: Disco.value,
    Genero: Genero.value,
    "Emision Disco": Emision.value,
    Estado: Estado.value,
    Comentarios: Comentarios.value,
    Puntuacion: Puntuacion.value
  };

  await fetch(WORKER + "/update", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  });

  alert("Registro actualizado");
}

cargar();
</script>

</body>
</html>
