<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar registro MP3H</title>

<style>
/* MISMO CSS QUE form-add.html */
</style>
</head>

<body class="dark">

<div class="toggle" onclick="toggleMode()">Cambiar modo</div>

<div class="container">
  <h1>Editar registro</h1>

  <input type="hidden" id="idx">

  <label>Pos</label>
  <input id="Pos">

  <label>Banda</label>
  <input id="Banda">

  <label>Disco</label>
  <input id="Disco">

  <label>Genero</label>
  <input id="Genero">

  <label>Emisión</label>
  <input id="Emision" type="date">

  <label>Estado</label>
  <select id="Estado">
    <option value="---">---</option>
    <option value="Pre-ok">Pre-ok</option>
    <option value="Ok">Ok</option>
    <option value="No">No</option>
    <option value="Disp">Disp</option>
  </select>

  <label>Comentarios</label>
  <textarea id="Comentarios" rows="3"></textarea>

  <label>Puntuación</label>
  <input id="Puntuacion">

  <button onclick="guardar()">Guardar cambios</button>
</div>

<script>
const WORKER = "https://mp3h-backend.josejaviertroncoso.workers.dev";
let datos = [];
let idx = null;

function toggleMode() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

async function cargar() {
  const params = new URLSearchParams(location.search);
  idx = parseInt(params.get("id"));

  const res = await fetch(WORKER + "/mp3h.json");
  datos = await res.json();

  const d = datos[idx];

  Pos.value = d.Pos || "";
  Banda.value = d.Banda || "";
  Disco.value = d.Disco || "";
  Genero.value = d.Genero || "";
  Emision.value = d["Emision Disco"] || "";
  Estado.value = d.Estado || "";
  Comentarios.value = d.Comentarios || "";
  Puntuacion.value = d.Puntuacion || "";
}

async function guardar() {
  datos[idx] = {
    Pos: Pos.value,
    Banda: Banda.value,
    Disco: Disco.value,
    Genero: Genero.value,
    "Emision Disco": Emision.value,
    Estado: Estado.value,
    Comentarios: Comentarios.value,
    Puntuacion: Puntuacion.value
  };

  await fetch(WORKER + "/update", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  });

  alert("Registro actualizado");
}

cargar();
</script>

</body>
</html>
